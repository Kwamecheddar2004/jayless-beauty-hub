<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Account | Jayless Beauty Hub</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-dark d-flex align-items-center justify-content-center min-vh-100">

  <div class="card p-4 p-md-5 border-0 shadow-lg rounded-4 text-white" style="max-width: 450px; width: 90%; background: #1F0A15; border: 1px solid var(--primary-gold) !important;">
    <div class="text-center mb-4">
      <img src="images/logo/logo.png" alt="Logo" class="brand-logo mb-2" style="width: 60px; height: 60px;" onerror="this.src='images/services/makeup.jpg'">
      <h3 class="brand-font text-gold mb-1">JAYLESS BEAUTY HUB</h3>
      <p class="small text-muted">Create a new client account</p>
    </div>

    <form id="registerForm">
      <div class="mb-3">
        <label class="form-label small text-muted">Full Name</label>
        <input type="text" id="regName" class="form-control" placeholder="e.g. Ama Serwaa" required>
      </div>

      <div class="mb-3">
        <label class="form-label small text-muted">Email Address</label>
        <input type="email" id="regEmail" class="form-control" placeholder="e.g. ama@example.com" required>
      </div>

      <div class="mb-4">
        <label class="form-label small text-muted">Password</label>
        <input type="password" id="regPassword" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-gold w-100 py-3 mb-3"><i class="fa-solid fa-user-plus me-2"></i> Create Account</button>
    </form>

    <div class="text-center small text-muted">
      <span>Already have an account? </span>
      <a href="login.html" class="text-gold font-weight-bold">Sign In here</a>
    </div>
    <div class="text-center mt-3">
      <a href="index.html" class="small text-light opacity-75"><i class="fa-solid fa-arrow-left me-1"></i> Return to Homepage</a>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script>
    document.getElementById('registerForm')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('regName').value;
      const email = document.getElementById('regEmail').value;
      const password = document.getElementById('regPassword').value;

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });
        const data = await res.json();
        if (data.success) {
          localStorage.setItem('jbh_token', data.token);
          localStorage.setItem('jbh_user', JSON.stringify(data.user));
          showToast('Account Created', 'Welcome to Jayless Beauty Hub!', 'success');
          setTimeout(() => {
            window.location.href = 'booking.html';
          }, 1000);
        } else {
          showToast('Registration Error', data.message || 'Error creating account', 'danger');
        }
      } catch (err) {
        showToast('Error', 'Server connection error', 'danger');
      }
    });
  </script>
</body>
</html>
